name: CI

on:
  push:
    branches: [main, post-hackathon]
  pull_request:
    branches: [main, post-hackathon]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen --extra dev --extra x402

      - name: Ruff (correctness rules — E9, F)
        run: uv run python -m ruff check src/ tests/ installer/ scripts/ relay/ hermes_plugin/

      - name: Pytest
        # No path: pyproject.toml's [tool.pytest.ini_options] testpaths = ["tests"] is the
        # single source of truth for what runs. Naming a file here let tests/test_installer.py
        # (added N10-5) go uncollected in CI while passing locally — N11-1.
        run: uv run python -m pytest -q

  dashboard-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Typecheck (src/ only — see dashboard/scripts/typecheck-src.mjs)
        working-directory: dashboard
        run: npm run typecheck:src

      - name: Test
        # P24-6 (W6): P23's 19 cross-language crypto golden-fixture tests (and
        # everything W1/W2 added on top) had zero automated backstop until now
        # -- this job ran typecheck only, never `npm test`.
        working-directory: dashboard
        run: npm test

      - name: Lint
        working-directory: dashboard
        run: npm run lint

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build relay image
        run: docker build -t emporia-relay .
