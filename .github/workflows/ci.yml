name: CI

on:
  push:
    branches: [main, post-hackathon]
  pull_request:
    branches: [main, post-hackathon]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff (correctness rules — E9, F)
        run: uv run python -m ruff check src/ tests/ installer/ scripts/ relay/

      - name: Pytest
        run: uv run python -m pytest tests/test_emporia.py -q

  dashboard-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Typecheck (src/ only — see dashboard/scripts/typecheck-src.mjs)
        working-directory: dashboard
        run: npm run typecheck:src

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build relay image
        run: docker build -t emporia-relay .
