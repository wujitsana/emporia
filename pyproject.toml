[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emporia"
version = "0.2.0"
description = "Emporia — federated agent commerce relay"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Each bound is a floor plus the next major (or 0.x minor) above the version uv.lock
# pins: `uv sync --frozen` installs the lock; the pip fallback in `hermes emporia setup`
# resolves these ranges (catalog rule 10). tests/test_dependency_bounds.py keeps them bounded.
dependencies = [
    "fastapi>=0.111.0,<1",     # the agent's local console (emporia.console) is a FastAPI app too
    "uvicorn>=0.30.0,<1",      # ... served by plain uvicorn; the relay adds the [standard] extras (see `relay`)
    "fastmcp>=4.1.3,<5",
    "httpx>=0.27.0,<1",
    "websockets>=12.0,<17",
    "pydantic>=2.0.0,<3",
    "cryptography>=42.0.0,<50",
    "chess>=1.10.0,<2",        # the house agent's rules runner (emporia.house) and local turn validation (modules/chess)
]
# The base set is what an AGENT needs: its MCP server, bridge, CLI, SDK, console and house runner.
# What only a RELAY needs is the `relay` extra, so `hermes emporia setup` (an agent) installs
# less than a relay does. (The `stripe` package was dropped: nothing imported it.)

[project.optional-dependencies]
# Only a relay imports these (every import of them is lazy or inside relay-only modules): the
# faster uvicorn event loop and parsers (uvloop, httptools, watchfiles, python-dotenv, pyyaml),
# Sentry error reporting and the drand BLS check (py-ecc). Installed by the Dockerfile, CI and
# the checkout installers.
relay = [
    "uvicorn[standard]>=0.30.0,<1",
    "sentry-sdk>=2.0.0,<3",
    "py-ecc>=8.0.0,<9",   # the randomness service verifies drand BLS signatures in pure Python (emporia.beacon)
]
# P45: the x402 payer (src/emporia/x402_payer.py) needs EIP-712 signing, which
# pulls ~19 packages. P106: the relay needs it too now -- the escrow operator
# (P96-P99) signs and ABI-encodes on the relay -- so the Dockerfile installs
# this extra. Plain `exact` x402 is still verified via the facilitator.
x402 = [
    "eth-account>=0.13.0,<0.15",
]
# P155: an agent paying x402 on Solana (emporia.x402_svm). Optional: nothing
# else needs it, and it is imported only when a Solana payment is signed.
solana = [
    "solders>=0.21,<0.28",
]
# P293 (signer phase 2): the signer's AWS KMS back end (emporia.signer_backends). Only
# the signer installs it; nothing an agent runs imports it.
kms = [
    "boto3>=1.43,<2",
]
dev = [
    "pytest>=8.0.0,<10",
    "pytest-asyncio>=0.23.0,<2",
    "httpx>=0.27.0,<1",
    "pyyaml>=6.0.0,<7",
    "ruff>=0.16.0,<1",
]

[project.scripts]
emporia = "emporia.cli:main"
emporia-relay = "emporia.relay_server:main"
emporia-mcp = "emporia.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/emporia"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# P45: `testnet` marks tests that talk to real external infrastructure (the
# public x402 facilitator, a Base Sepolia RPC, Stripe's test mode). They are
# excluded from the default run and from CI -- they need funded keys and a
# live network, so a red build would mean "the internet is down", not "the
# code is wrong". Opt in with `pytest -m testnet` (see docs/testnet.md).
# P248: `live` marks tests/live, which start real relay processes and talk to them
# over HTTP; they take minutes, so they are off by default too. `pytest -m live tests/live`.
addopts = "-m 'not testnet and not live'"
markers = [
    "testnet: opt-in integration test against real external payment infrastructure",
    "live: opt-in test across real relay processes on this machine (tests/live; pytest -m live tests/live)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Correctness-only for now: pyflakes + syntax errors. The full default ruleset (E402,
# BLE001, S110, etc.) surfaces ~250 pre-existing style findings across the repo that
# aren't part of this pass — tracked separately, not gating CI yet.
select = ["E9", "F"]

[dependency-groups]
dev = [
    "anyio>=4.14.1,<5",
    "httpx>=0.28.1,<1",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
]
