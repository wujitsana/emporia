[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emporia"
version = "0.2.0"
description = "Emporia — federated agent commerce relay"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "fastmcp>=4.1.3",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "pydantic>=2.0.0",
    "cryptography>=42.0.0",
    "stripe>=9.0.0",
    "chess>=1.10.0",
    "sentry-sdk>=2.0.0",
]

[project.optional-dependencies]
# P45: the x402 payer (src/emporia/x402_payer.py) needs EIP-712 signing, which
# pulls ~19 packages. The relay only ever *verifies* x402 credentials via the
# facilitator, so it must not carry that weight -- the Dockerfile's
# `uv sync --frozen --no-dev` deliberately installs neither this extra nor dev.
# CI adds `--extra x402` so the payer's tests run.
x402 = [
    "eth-account>=0.13.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "ruff>=0.16.0",
]

[project.scripts]
emporia-relay = "emporia.relay_server:main"
emporia-mcp = "emporia.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/emporia"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# P45: `testnet` marks tests that talk to real external infrastructure (the
# public x402 facilitator, a Base Sepolia RPC, Stripe's test mode). They are
# excluded from the default run and from CI -- they need funded keys and a
# live network, so a red build would mean "the internet is down", not "the
# code is wrong". Opt in with `pytest -m testnet` (see docs/testnet.md).
addopts = "-m 'not testnet'"
markers = [
    "testnet: opt-in integration test against real external payment infrastructure",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Correctness-only for now: pyflakes + syntax errors. The full default ruleset (E402,
# BLE001, S110, etc.) surfaces ~250 pre-existing style findings across the repo that
# aren't part of this pass — tracked separately, not gating CI yet.
select = ["E9", "F"]

[dependency-groups]
dev = [
    "anyio>=4.14.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
